name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push cancels the previous run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_DIR: backend/library
  FRONTEND_DIR: frontend/library
  PHP_VERSION: "8.3"
  NODE_VERSION: "24"

jobs:
  # ==========================================================================
  # Dockerfiles
  # ==========================================================================
  dockerfile-lint:
    name: Dockerfile lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/library/Dockerfile
          # DL3018: pinning apk versions is not worth it for this project.
          ignore: DL3018
          failure-threshold: warning

  # ==========================================================================
  # Backend (Laravel)
  # ==========================================================================
  backend-lint:
    name: Backend lint (Pint + Composer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ env.PHP_VERSION }}-composer-${{ hashFiles('backend/library/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ env.PHP_VERSION }}-composer-

      - name: Validate composer.json / composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Security audit
        run: composer audit --no-dev

  backend-tests:
    name: Backend tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        db: [sqlite]
        include:
          # Same engine as production (docker-compose).
          - php: "8.3"
            db: pgsql
    # The Postgres container is only started for the pgsql entry (empty image = no service).
    services:
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_DB: library_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Overrides phpunit.xml (sqlite :memory:) only for the pgsql entry.
      DB_CONNECTION: ${{ matrix.db == 'pgsql' && 'pgsql' || 'sqlite' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.db == 'pgsql' && 'library_test' || ':memory:' }}
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: ${{ matrix.php == '8.3' && matrix.db == 'sqlite' && 'pcov' || 'none' }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('backend/library/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: |
          if [ "${{ matrix.php }}" = "8.3" ] && [ "${{ matrix.db }}" = "sqlite" ]; then
            php artisan test --log-junit reports/junit.xml --coverage-clover reports/clover.xml
          else
            php artisan test --log-junit reports/junit.xml
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-php${{ matrix.php }}-${{ matrix.db }}
          path: ${{ env.BACKEND_DIR }}/reports/
          retention-days: 7
          if-no-files-found: ignore

  backend-build:
    name: Backend build (production bundle)
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ env.PHP_VERSION }}-composer-${{ hashFiles('backend/library/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ env.PHP_VERSION }}-composer-

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative

      - name: Package build
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          tar --exclude='./tests' --exclude='./rest' --exclude='./.env' \
              --exclude='./database/*.sqlite' --exclude='./storage/logs/*' \
              -czf "$RUNNER_TEMP/dist/backend-${GITHUB_SHA::7}.tar.gz" .

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ${{ runner.temp }}/dist/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  # ==========================================================================
  # Frontend (React + Vite)
  # ==========================================================================
  frontend-lint:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_DIR }}/package.json

      - name: Setup Node.js (with pnpm store cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: ${{ env.FRONTEND_DIR }}/coverage/
          retention-days: 7
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-tests]
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_DIR }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: /api

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist/
          retention-days: 14
          if-no-files-found: error
