# Library app: PostgreSQL + Laravel API (FrankenPHP) + React SPA (Nginx)
#
#   cp .env.example .env      # optional, every variable has a default
#   docker compose up -d --build
#
#   Frontend  -> http://localhost:8081        (the SPA calls /api, proxied to the backend)
#   Backend   -> http://localhost:8010/books
name: library

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-library}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433 on the host so it doesn't clash with a local PostgreSQL on 5432.
      - "${DB_FORWARD_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  backend:
    <<: *restart
    build:
      context: ./backend/library
      target: runtime
      args:
        APP_VERSION: ${IMAGE_TAG:-latest}
    image: ${DOCKERHUB_NAMESPACE:-angelestarita}/books-backend:${IMAGE_TAG:-latest}
    environment:
      APP_NAME: "Library API"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:${BACKEND_PORT:-8010}
      APP_LOCALE: es
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-library}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_WRITES_PER_MINUTE: ${RATE_LIMIT_WRITES_PER_MINUTE:-20}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  frontend:
    <<: *restart
    build:
      context: ./frontend/library
      target: runtime
      args:
        VITE_API_URL: /api
        APP_VERSION: ${IMAGE_TAG:-latest}
    image: ${DOCKERHUB_NAMESPACE:-angelestarita}/books-frontend:${IMAGE_TAG:-latest}
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend

volumes:
  db-data:

networks:
  backend:
  frontend:
